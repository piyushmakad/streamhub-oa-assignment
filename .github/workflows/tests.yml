name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:api
      - run: npm run test:sql
      # The UI suite depends on a live third-party site; a failure there is reported but
      # does not block the API/SQL gates.
      - run: npm run test:ui
        continue-on-error: true
      - run: npm run test:healing
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
